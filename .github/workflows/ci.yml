name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The loopback UDP e2e suite opens real broadcast sockets; it is only
      # stable under --concurrency=1 (sockets conflict when run in parallel).
      - name: Test
        run: flutter test --concurrency=1